version: 1
name: network-partition-fencing
description: |
  Verify that Globular detects a network partition and automatically fences the
  isolated node to protect new deployments.

  This test blocks all network traffic on node-3 (a worker node) using iptables,
  then verifies that:
    1. The cluster controller detects the heartbeat going stale within ~5 minutes
    2. The invariant enforcement workflow classifies it as WARN (>5min) then CRITICAL (>15min)
    3. After the critical threshold, the node is marked with partition_fenced_since
    4. The fence is automatically cleared when the network is restored and heartbeat resumes

  What Globular does automatically:
    - Heartbeat staleness tracked in cluster state (LastSeen field)
    - WARN after 5 minutes (reconcile blocks new deployments to stale nodes)
    - CRITICAL after 15 minutes → sets Metadata["partition_fenced_since"]
    - Fenced nodes are skipped by the release pipeline
    - When heartbeat resumes, fence is auto-cleared and node_partition_healed event emitted
    - If ≥2 nodes go critical simultaneously, quorum_loss_imminent event + etcd alert key written

  What requires operator action:
    - Diagnosing and fixing the network issue
    - Manual node recovery if heartbeat does not resume within the grace period

  NOTE: This test uses a worker node (node-3) which does NOT run etcd.
  Isolating a founding node (node-1, node-2, node-3 in a 3-node cluster) would
  risk actual etcd quorum loss — use dual-node-failure.yaml for that scenario.

suite: resilience
tags:
  - chaos
  - network
  - partition
  - fencing
  - invariant

cluster:
  profile: quickstart-5node
  require_healthy_before_start: true
  reset_before: false
  reset_after: false

preconditions:
  - type: probe
    id: cluster_healthy
    probe: cluster.health
    expect:
      status: healthy
      members_gte: 3

  - type: probe
    id: node5_running
    probe: node.container_running
    params:
      node: node-5
    expect:
      running: true

baseline:
  - type: probe
    id: cluster_health_before
    probe: cluster.health

  - type: probe
    id: node5_registered
    probe: cluster.nodes
    params:
      node: node-5

steps:
  # Settle before injecting the fault.
  #
  # This scenario asserts that partitioning ONE node does not raise the
  # quorum-loss alert — that needs >= 2 critical nodes. It runs after
  # dual-node-failure (which stops two nodes) and after a recovery-suite
  # cluster rebuild, so a predecessor's node can still be heartbeat-stale here.
  # Observed: node-3 was still "converging" when node-5 was partitioned, giving
  # two critical nodes, so the alert fired correctly and this scenario failed
  # for its predecessor's residue rather than for anything it did.
  #
  # These are steps, not preconditions: the runner executes `action: wait` in
  # steps only — a wait placed under `preconditions:` is silently skipped, which
  # is why the first attempt at this guard did nothing.
  - id: wait_no_stale_quorum_alert
    action: wait
    params:
      timeout: 300
      poll_interval: 15
      until:
        probe: cluster.quorum_loss_alert
        params: {}
        expect:
          alert_present: false

  - id: wait_all_nodes_ready
    action: wait
    params:
      timeout: 600
      poll_interval: 20
      until:
        probe: cluster.health
        params: {}
        expect:
          status: healthy
          members_gte: 3

  # Block network traffic on node-5 (worker, no etcd)
  - id: block_network_node5
    action: chaos.block_network
    params:
      node: node-5
      direction: both

  # Wait for heartbeat to go stale (WARN threshold = 5 minutes).
  #
  # This MUST be an unconditional sleep. It was written with
  # `until: cluster.health == healthy`, but a `wait` with an `until` returns as
  # soon as the condition first passes — and the cluster is healthy on the very
  # first poll, because only 1 of 5 nodes is partitioned. So this step consumed
  # ~0s instead of 6 minutes, the scenario reached the fencing assertion at
  # ~11 minutes, and the node was correctly NOT yet fenced: the controller
  # fences at the 15-minute CRITICAL threshold. The scenario was failing on its
  # own clock rather than on cluster behaviour.
  - id: wait_warn_threshold
    action: wait
    params:
      timeout: 360   # 6 minutes — gives buffer past the 5min WARN threshold

  # The cluster stays healthy while one node is partitioned — asserted
  # separately so it cannot short-circuit the wait above.
  - id: cluster_healthy_during_partition
    probe: cluster.health
    expect:
      status: healthy

  # Wait for CRITICAL threshold and fencing (15 minutes total)
  - id: wait_critical_threshold
    action: wait
    params:
      # 900s stale threshold + up to one 60s enforcement tick = ~960s worst
      # case observation time, measured from the moment the network is blocked.
      # The previous budget was 360 + 600 = 960s before the node5_fenced
      # assertion — a ONE SECOND margin against a directly measured 959s.
      #
      # Measured 2026-08-12 by direct observation, not inference: node-5
      # blocked at 19:06:04, partition_fenced_since = 19:22:03, i.e. 959s, and
      # no other node was fenced. Isolation, LastSeen ageing, the threshold and
      # the fencing path are all confirmed working — the scenario was simply
      # racing them.
      #
      # This assertion used to pass for the WRONG REASON. The controller held
      # its global state lock across etcd I/O in the heartbeat path, which
      # starved heartbeat commits and pre-aged every node's LastSeen, so
      # fencing fired far earlier than the real threshold. Fixing that
      # (services: ReportNodeStatus off-lock write) removed the confounder and
      # left this scenario asserting one second inside a 959s mechanism. The
      # apparent "regression" was this timing defect becoming visible.
      #
      # 900 gives ~4 minutes of slack over the measured worst case. Do NOT
      # "fix" a failure here by lowering the controller's staleness threshold:
      # the threshold is the invariant, this number is just a test budget.
      timeout: 900   # ~4min margin over the measured 959s fence time
      poll_interval: 60

  # Give invariant enforcement time to fence the node
  - id: settle_after_fence
    action: wait
    params:
      timeout: 60

assertions:
  # Node is fenced — partition_fenced_since is set in cluster state
  - type: probe
    id: node5_fenced
    probe: node.partition_fenced
    params:
      node: node-5
    expect:
      fenced: true

  # Cluster is still healthy — one worker node partitioned does not break the cluster
  - type: probe
    id: cluster_still_healthy
    probe: cluster.health
    expect:
      status: healthy
      members_gte: 3

  # No quorum loss alert — only 1 node is critical
  - type: probe
    id: no_quorum_loss_alert
    probe: cluster.quorum_loss_alert
    expect:
      alert_present: false

cleanup:
  # Restore network on node-5
  - id: unblock_network_node5
    action: chaos.unblock_network
    params:
      node: node-5

  # Wait for heartbeat to resume and fence to be auto-cleared.
  #
  # 120s could not cover the unfence path. Clearing a fence is not a reaction
  # to the network coming back — it requires the node to leave the controller's
  # critical set, which is heartbeat-resume, THEN the staleness threshold
  # expiring, THEN an invariant-enforcement tick observing it
  # (workflow_invariant.go: unfence happens on `!criticalSet[id] &&
  # alreadyFenced`). Three sequential intervals, none of them 120s long
  # together. On 2026-08-24 this cleanup failed with the fence still set, and
  # the same probe reported fenced:false when asked again later — the fence
  # cleared exactly as designed, just after the scenario had stopped looking.
  #
  # The assertion is unchanged and still fails a fence that never clears —
  # which matters, because latching forever is a known failure mode of this
  # path (quorum-loss alert and partition fences latching because the release
  # is gated on the raise condition). Only the window now matches the product's
  # actual convergence chain.
  - id: wait_fence_cleared
    action: wait
    params:
      timeout: 600
      poll_interval: 20
      until:
        probe: node.partition_fenced
        params:
          node: node-5
        expect:
          fenced: false
