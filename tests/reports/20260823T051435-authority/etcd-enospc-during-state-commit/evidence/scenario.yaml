version: 1
name: etcd-enospc-during-state-commit
description: |
  A desired-state mutation attempted while etcd cannot write must be atomic:
  committed, or rejected. Never half-published.

  THE FAULT. Exhaust etcd's backend QUOTA, then attempt a real desired-state
  change, then release it.

  WHY QUOTA AND NOT A FULL DISK. The first version of this filled the filesystem
  etcd writes to. That directory lives on the HOST root filesystem via a docker
  volume, so "leave 2 MB free" meant writing ~57 GB to the developer's disk — and
  the only reason it did not is that it timed out first. Filling someone's disk to
  test a cluster property is not an acceptable trade at any speed.
  Quota exhaustion is also the faithful fault: the 2026-08-16 outage was
  quota-backend-bytes exceeded, not a full disk.

  WHY THIS IS NOT disk-pressure-detection. That scenario fills the node's root
  disk and checks the cluster NOTICES. This makes etcd refuse writes and attempts
  a mutation into that refusal — so the question is not detection but atomicity.

  WHY IT MATTERS HERE SPECIFICALLY. The 2026-08-16 outage was an etcd NOSPACE
  event: the backend hit quota and the control plane went read-only. What was
  never established is what happens to a mutation caught in that window. A
  desired-state write is not one key: it is a record, a generation, and the
  reconcile that follows. A partial write leaves the cluster pointed at something
  nobody chose, and — worse — leaves no error for the operator to act on, because
  from the caller's side the command simply failed.

  THE TWO ACCEPTABLE OUTCOMES, and there is no third:

      the mutation never happened      — refused, nothing changed
      the mutation completed exactly once

  There is no acceptable state called "the record is there but the generation is
  not", and none called "the command failed but the write landed".

  WHAT MUST HOLD. After the space is released, the cluster returns to healthy
  with no standing alarms, no ambiguous or half-published artifacts, and desired
  state coherent — whichever of the two outcomes occurred.

suite: authority
tags:
  - atomicity
  - etcd
  - nospc
  - destructive
  - incident-2026-08-16

cluster:
  profile: quickstart-5node
  require_healthy_before_start: true
  reset_before: false
  reset_after: false

preconditions:
  - type: probe
    id: cluster_healthy
    probe: cluster.health
    expect:
      status: healthy

  - type: probe
    id: no_standing_alarms
    probe: etcd.backend_growth
    expect:
      alarms: 0

  - type: probe
    id: writes_work_before
    probe: etcd.write_test
    expect:
      success: true

  # A settled cluster means liveness is current, not merely that cluster.health
  # says "healthy". require_healthy_before_start passed at a moment when liveness
  # was 927 seconds stale after the blackout scenario, so the next scenario began
  # mutating a cluster that had not finished recovering — and left residue when
  # its first steps failed. Asserting liveness here fails fast, with a reason.
  - type: probe
    id: liveness_settled_before
    probe: state.liveness_freshness
    expect:
      stale_nodes: 0
      nodes_gte: 5

baseline:
  - type: probe
    id: desired_state_before
    probe: cluster.desired_state

  - type: probe
    id: identity_findings_before
    probe: repository.identity_findings

steps:
  # Writes 1 MB values and stops the moment NOSPACE fires, so it injects the
  # fault with the minimum data. Refuses outright if the host cannot spare 8 GB,
  # reporting UNSUPPORTED rather than risking the machine — a property left
  # untested is honest, filling someone's disk is not.
  - type: action
    id: exhaust_the_etcd_quota
    action: chaos.fill_etcd_volume
    params:
      node: node-1
      require_host_free_gb: 8

  - type: action
    id: let_etcd_notice
    action: wait
    params:
      seconds: 60
      reason: "give etcd time to fail a write and raise its alarm before a mutation is attempted"

  # Deliberately NOT asserted as accepted or refused: either is correct. What is
  # forbidden is a half-applied result, which the assertions below look for.
  # expect:any records the outcome without prejudging it.
  - type: action
    id: attempt_mutation_while_full
    action: ops.set_desired
    params:
      node: node-1
      name: dns
      # @staged resolves to the version this release actually shipped.
      # The literal 1.2.312 was correct for the cluster this scenario was
      # written against; on 1.2.328 it is not a published version, so the
      # control plane refused a request the scenario expected it to accept
      # and the refusal was read as a control-plane defect.
      version: "@staged"
      expect: any

  # Delete, compact, defrag, disarm — in that order. Deleting alone frees
  # nothing, and NOSPACE stays latched even after space returns.
  - type: action
    id: release_the_quota
    action: chaos.clear_etcd_volume_fill
    params:
      node: node-1

  - type: action
    id: allow_recovery
    action: wait
    params:
      seconds: 240
      reason: "compaction, defrag and alarm disarm need time once quota is available again"

assertions:
  # ── Nothing half-published ────────────────────────────────────────────────
  # A partial commit surfaces as an artifact that resolves ambiguously, or a
  # manifest whose blob never landed.
  - type: probe
    id: no_half_published_artifacts
    probe: repository.identity_findings
    expect:
      ambiguous: 0
      conflict: 0
      missing_blob: 0

  - type: probe
    id: desired_state_coherent
    probe: cluster.desired_state
    expect:
      count_gte: 1

  # ── etcd recovered rather than latched ────────────────────────────────────
  # NOSPACE latches: once raised, etcd stays read-only until the alarm is
  # disarmed even after space returns. A cluster that cannot clear its own alarm
  # is a cluster that needs an operator for a condition it created.
  - type: probe
    id: alarms_cleared
    probe: etcd.backend_growth
    expect:
      alarms: 0

  - type: probe
    id: writes_work_again
    probe: etcd.write_test
    expect:
      success: true

  # ── And the cluster is whole ──────────────────────────────────────────────
  - type: probe
    id: cluster_healthy_after
    probe: cluster.health
    expect:
      status: healthy

  - type: probe
    id: etcd_members_healthy
    probe: cluster.etcd_members
    expect:
      unhealthy: 0

  - type: probe
    id: liveness_current
    probe: state.liveness_freshness
    expect:
      stale_nodes: 0

cleanup:
  # Idempotent: deleting keys that are already gone and disarming an alarm that is
  # already clear are both no-ops, so this safely guarantees the quota is not left
  # exhausted if the scenario aborted part-way.
  - type: action
    id: ensure_quota_released
    action: chaos.clear_etcd_volume_fill
    params:
      node: node-1
