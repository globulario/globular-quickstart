version: 1
name: rollback-guard-refuses-silent-regression
description: |
  Going backwards must be possible, deliberate, and audited — never accidental.

  WHY THIS EXISTS. On 2026-08-16 a bad controller shipped and the rollback was
  REFUSED:

      desired-state: refusing to regress cluster-controller — desired floor is
      1.2.317, attempted 1.2.316; pass --allow-regression to override (audited)

  That refusal is correct behaviour and it was still a surprise, at the worst
  possible moment, on a degraded cluster. "Can I get back?" is the only question
  that matters once something bad is running, and nothing in the suite answered
  it. An operator should learn how the guard behaves from a test, not from an
  incident.

  THE TWO PROPERTIES, and they pull against each other:

    1. A regression must not happen by accident. `services desired set` to an
       older version is refused unless the operator explicitly asks, so a
       mistyped version or a stale script cannot walk the cluster backwards.

    2. A regression must remain POSSIBLE. A guard with no override is not a
       safety feature, it is a trap: it converts "we shipped a bad version" into
       "we shipped a bad version and cannot leave". The override exists, is
       explicit, and is audited.

  WHAT THIS SCENARIO CAN AND CANNOT DO HERE. Exercising the floor needs two
  published versions of one package, and a release bundle ships exactly one
  version per package — so on a freshly built simulation the older artifact
  simply does not exist to roll back to. What IS reachable, and is asserted
  here, is that the control plane refuses to move desired state to a version it
  cannot resolve, and that a refusal leaves no residue behind.

  The full floor test belongs on a cluster that has taken at least two releases
  of the same package. That is the real cluster, and it is the reason this
  scenario states its limit rather than quietly asserting less than its name
  claims — a scenario whose name overpromises is how a suite loses its meaning.

suite: upgrade
tags:
  - rollback
  - desired-state
  - regression-guard
  - incident-2026-08-16

cluster:
  profile: quickstart-5node
  require_healthy_before_start: true
  reset_before: false
  reset_after: false

preconditions:
  - type: probe
    id: cluster_healthy
    probe: cluster.health
    expect:
      status: healthy

  - type: probe
    id: releases_are_clean
    probe: release.audit
    expect:
      failed: 0

baseline:
  - type: probe
    id: convergence_before
    probe: cluster.installed_version_convergence
    params:
      package: node-agent

steps:
  # ── A backwards step that cannot be resolved is refused ───────────────────
  # This is the accident case: a stale script or a mistyped version. The guard
  # must not walk the cluster backwards on it.
  - type: action
    id: refuse_backwards_step
    action: ops.set_desired
    params:
      node: node-1
      name: node-agent
      version: 1.2.300
      expect: refused

  # ── And refused even WITH the override, when the target does not exist ────
  # This is the property most easily got wrong. --allow-regression authorizes
  # going backwards; it does not authorize going somewhere that is not there.
  # An override that also bypassed resolvability would turn a safety valve into
  # a way to point the cluster at nothing.
  - type: action
    id: override_does_not_bypass_resolvability
    action: ops.set_desired
    params:
      node: node-1
      name: node-agent
      version: 1.2.300
      allow_regression: true
      expect: refused

  - type: action
    id: settle
    action: wait
    params:
      seconds: 45
      reason: "let the controller process the rejected writes before inspecting state"

assertions:
  # ── The refusals changed nothing ──────────────────────────────────────────
  - type: probe
    id: installed_version_unchanged
    probe: cluster.installed_version_convergence
    params:
      package: node-agent
    expect:
      unique_lte: 1
      nodes_gte: 5

  - type: probe
    id: no_release_failures_introduced
    probe: release.audit
    expect:
      failed: 0

  - type: probe
    id: repository_identity_still_clean
    probe: repository.identity_findings
    expect:
      ambiguous: 0
      missing_blob: 0
      conflict: 0

  # ── And the cluster is unharmed by refusing ───────────────────────────────
  - type: probe
    id: cluster_still_healthy
    probe: cluster.health
    expect:
      status: healthy

  - type: probe
    id: liveness_unaffected
    probe: state.liveness_freshness
    expect:
      stale_nodes: 0

cleanup: []
