# Globular Quickstart — 5-node cluster built the way the distro builds one
# Usage: make up  (or: docker compose up -d)
#
# node-1 is the founding node: it runs the release's install.sh (Day-0) and
# then `globular cluster bootstrap`. node-2..5 join through the founder's
# gateway using the real join script. There is no parallel bring-up and no
# pre-seeded state — the cluster forms in the same order a real one does,
# which is why bring-up takes ~10-15 min rather than ~2.
#
# PROFILES are only those the release actually defines: core, compute,
# control-plane, storage. (The earlier compose invented "ai" and "gateway";
# the controller rejected them with `unknown profile "ai"`.)
#
# ScyllaDB is installed on the node by the installer — Day-0 on the founder,
# and on joiners only where placement assigns `storage`. That is 2 instances,
# each capped to 1 shard / 1500M by scripts/entrypoint.sh.

x-node-defaults: &node-defaults
  build:
    context: .
    args:
      RELEASE_VERSION: ${RELEASE_VERSION:-1.2.288}
  image: globulario/globular-node:latest
  privileged: true
  cgroup: host
  # Use Globular DNS (node-1) for *.globular.internal resolution.
  # Without this, Docker's embedded resolver forwards to the host resolver,
  # which returns the REAL cluster IPs (10.0.0.x) instead of the Docker
  # network IPs (10.10.0.x), breaking all mesh/service discovery.
  dns:
    - 10.10.0.11
    - 8.8.8.8
  # A docker tmpfs with no size= defaults to HALF THE HOST'S RAM, per mount.
  # Five nodes x three mounts was 360 GB of RAM-backed headroom on a 46 GB
  # machine, and nothing anywhere bounded it.
  tmpfs:
    - /run:size=1g
    - /run/lock:size=16m
  # /tmp is deliberately NOT a tmpfs — it lives on the container's overlay,
  # which is disk.
  #
  # It used to be `- /tmp:exec`, and that is what froze the developer's machine
  # three times on 2026-08-17. Every package install stages its extracted
  # payload in /tmp/globular-package-<n> and the Day-0/Day-1 installer never
  # removes it (globular-installer cmd/globular-installer/main.go — it sets
  # opts.StagingDir from ExtractPackageToTemp with no matching RemoveAll; the
  # two node_agent call sites do defer os.RemoveAll and are fine). One Day-0
  # left 48 such directories and 1.6 GB behind ON ONE NODE. On a real Ubuntu
  # node that is a disk leak; on a tmpfs it is a RAM leak, and tmpfs pages are
  # unreclaimable — they can only go to a 2 GB swapfile. Five nodes, plus every
  # rejoin/upgrade/install-loop scenario that re-installs, walked the host into
  # reclaim thrash: "Under memory pressure, flushing caches" from 13:46, dead
  # at 13:53.
  #
  # The `exec` flag was the reason it was a tmpfs at all: docker mounts tmpfs
  # noexec, install scripts stage payloads under /tmp and then test them with
  # `[[ -x ... ]]`, which calls access(X_OK) and honours the mount flag — so a
  # noexec /tmp made a correctly downloaded, mode-755 binary look absent. That
  # is how codex_0.142.3 failed Day-0 with the misleading "extracted payload
  # missing bin/codex". The overlay needs no flag: it is exec by default, which
  # is also what a real node does — /tmp on the root filesystem. There is no
  # tmp.mount unit in the image (`systemctl is-enabled tmp.mount` = not-found),
  # so dropping the mount leaves a plain directory rather than handing systemd
  # an excuse to mount its own tmpfs.
  networks:
    - globular-net
  restart: unless-stopped
  stop_grace_period: 30s
  environment: &node-env
    GLOBULAR_CLUSTER_DOMAIN: "globular.internal"
    GLOBULAR_CLUSTER_PEERS: "node-1=10.10.0.11,node-2=10.10.0.12,node-3=10.10.0.13,node-4=10.10.0.14,node-5=10.10.0.15"

services:
  # ── Founding node — runs Day-0 ─────────────────────────
  node-1:
    <<: *node-defaults
    hostname: node-1
    container_name: globular-node-1
    mac_address: "02:42:0a:0a:00:0b"
    environment:
      <<: *node-env
      GLOBULAR_NODE_NAME: node-1
      GLOBULAR_NODE_IP: "10.10.0.11"
      GLOBULAR_ROLE: "founding"
      GLOBULAR_PROFILES: "core,control-plane,storage"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - cluster-handoff:/shared
      - node1-state:/var/lib/globular
      # Dedicated MinIO drives. A distributed objectstore needs >= 4 drives
      # total for EC:2+2; with 2 storage nodes that is 2 drives each. Without
      # them `objectstore disk scan` finds no admissible disk (every other path
      # is bind-mounted and already carries data), MinIO can only run
      # standalone, and cluster-doctor correctly reports
      # objectstore.standalone_in_cluster on a 5-node cluster.
      #
      # These are directories on one physical disk, so they provide no real
      # fault tolerance — they exist so the simulation models a production
      # topology and exercises erasure coding, pool membership and format.json
      # handling, which a standalone store never reaches.
      - node1-minio-d1:/var/lib/minio/d1
      - node1-minio-d2:/var/lib/minio/d2
    networks:
      globular-net:
        ipv4_address: 10.10.0.11
    ports:
      - "10443:443"     # HTTPS gateway (host 10443 → container 443)
      - "18443:8443"    # gateway / join endpoint

  # ── Joining nodes — real Day-1 join path ───────────────
  # No depends_on ordering games: each joiner waits for the founder to
  # publish a token and for the gateway to answer, which is the actual
  # precondition. Compose ordering cannot express "Day-0 finished".

  node-2:
    <<: *node-defaults
    hostname: node-2
    container_name: globular-node-2
    mac_address: "02:42:0a:0a:00:0c"
    environment:
      <<: *node-env
      GLOBULAR_NODE_NAME: node-2
      GLOBULAR_NODE_IP: "10.10.0.12"
      GLOBULAR_ROLE: "joining"
      GLOBULAR_CONTROLLER_IP: "10.10.0.11"
      GLOBULAR_PROFILES: "core,control-plane,storage"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - cluster-handoff:/shared
      - node2-state:/var/lib/globular
      # MinIO drives — see node-1.
      - node2-minio-d1:/var/lib/minio/d1
      - node2-minio-d2:/var/lib/minio/d2
    networks:
      globular-net:
        ipv4_address: 10.10.0.12

  node-3:
    <<: *node-defaults
    hostname: node-3
    container_name: globular-node-3
    mac_address: "02:42:0a:0a:00:0d"
    environment:
      <<: *node-env
      GLOBULAR_NODE_NAME: node-3
      GLOBULAR_NODE_IP: "10.10.0.13"
      GLOBULAR_ROLE: "joining"
      GLOBULAR_CONTROLLER_IP: "10.10.0.11"
      # storage added: distributed MinIO requires >= 3 pool nodes
      # ("MinIO pool has N nodes, need >= 3 for distributed erasure coding"),
      # not merely >= 4 drives. With only node-1 and node-2 carrying storage
      # the objectstore can never leave standalone mode, which cluster-doctor
      # correctly reports as objectstore.standalone_in_cluster on a 5-node
      # cluster. This also brings a third ScyllaDB instance (1 shard / 1500M).
      GLOBULAR_PROFILES: "core,control-plane,storage"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - cluster-handoff:/shared
      - node3-state:/var/lib/globular
      # MinIO drives — see node-1.
      - node3-minio-d1:/var/lib/minio/d1
      - node3-minio-d2:/var/lib/minio/d2
    networks:
      globular-net:
        ipv4_address: 10.10.0.13

  node-4:
    <<: *node-defaults
    hostname: node-4
    container_name: globular-node-4
    mac_address: "02:42:0a:0a:00:0e"
    environment:
      <<: *node-env
      GLOBULAR_NODE_NAME: node-4
      GLOBULAR_NODE_IP: "10.10.0.14"
      GLOBULAR_ROLE: "joining"
      GLOBULAR_CONTROLLER_IP: "10.10.0.11"
      GLOBULAR_PROFILES: "core,compute"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - cluster-handoff:/shared
      - node4-state:/var/lib/globular
    networks:
      globular-net:
        ipv4_address: 10.10.0.14

  node-5:
    <<: *node-defaults
    hostname: node-5
    container_name: globular-node-5
    mac_address: "02:42:0a:0a:00:0f"
    environment:
      <<: *node-env
      GLOBULAR_NODE_NAME: node-5
      GLOBULAR_NODE_IP: "10.10.0.15"
      GLOBULAR_ROLE: "joining"
      GLOBULAR_CONTROLLER_IP: "10.10.0.11"
      GLOBULAR_PROFILES: "core,compute"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - cluster-handoff:/shared
      - node5-state:/var/lib/globular
    networks:
      globular-net:
        ipv4_address: 10.10.0.15

volumes:
  # Carries the join token from the founder to the joiners — the courier an
  # operator would be. Not a Globular mechanism; nothing else crosses it.
  cluster-handoff:
  node1-state:
  node2-state:
  node3-state:
  node4-state:
  node5-state:
  # MinIO drives for the two storage-profile nodes (2 each = 4 total = EC:2+2).
  node1-minio-d1:
  node1-minio-d2:
  node2-minio-d1:
  node2-minio-d2:
  node3-minio-d1:
  node3-minio-d2:

networks:
  globular-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1
