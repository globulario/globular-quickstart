version: 1
name: node-join-convergence
description: |
  Verify that a node which leaves and returns re-registers in etcd and converges:
  desired state is applied, packages are installed, and the doctor reports no
  ERROR-severity findings afterwards.

  WHY THIS EXISTS

  On 2026-08-10 and again on 2026-08-14, Day-1 node joins failed in production
  because a bundled OS dependency (libnss-resolve) pinned an exact
  systemd-resolved version that the joining host did not have. The joins died at
  the package-install step and the node never converged. Nothing in this suite
  exercised a join, so the same break shipped twice.

  This scenario closes part of that gap: it proves that a node returning to the
  cluster actually reconverges rather than merely coming back up.

  WHAT THIS DOES *NOT* COVER — read before trusting a green run

  1. This is a REJOIN, not a fresh join. The node keeps its state directory and
     its already-installed packages, so the package-install path that actually
     broke twice is NOT exercised here. A true fresh join needs a harness action
     that does not exist yet (see "harness gap" below).

  2. Containers are not hosts. The libnss-resolve class of failure is an
     interaction between a bundled .deb and the host's systemd/nsswitch layer.
     Containers share the host kernel and do not run an independent
     systemd-resolved, so this simulation CANNOT reproduce that failure mode even
     with a fresh join. That layer is covered by the pinned-VM witness
     (services/scripts/release/verify-resolver-without-libnss.sh against Ubuntu
     Noble release-20260518 / systemd 255.4-1ubuntu8.15), which is complementary
     to this scenario, not replaced by it.

  So: a green run here means "a returning node reconverges". It does not mean
  "joins are safe". Both statements are needed and they come from different
  places.

  HARNESS GAP

  There is no `cluster.join_node` action, and `cluster-cold-boot` runs with
  reset_before:false, so no scenario currently forces a cold install of the
  release under test. `scripts/test-concurrent-join.sh` exercises joins outside
  the scenario system. Adding a reset-and-join action would let this file assert
  the install path directly and is the single highest-value addition to the
  harness for release gating.

suite: functional
tags:
  - join
  - convergence
  - reconcile
  - etcd
  - release-gate

cluster:
  profile: quickstart-5node
  require_healthy_before_start: true
  reset_before: false
  reset_after: false

preconditions:
  - type: probe
    id: cluster_healthy
    probe: cluster.health
    expect:
      status: healthy

  - type: probe
    id: target_node_registered_before
    probe: node.etcd_registered
    params:
      node: node-5
    expect:
      registered: true

baseline:
  # Captured so the post-rejoin comparison is against observed truth rather than
  # an assumption about what "converged" looked like.
  - type: probe
    id: installed_packages_before
    probe: node.installed_packages
    params:
      node: node-5

  - type: probe
    id: desired_state_before
    probe: cluster.desired_state

steps:
  - id: stop_target_node
    action: chaos.stop_node
    params:
      node: node-5

  - id: wait_for_departure_observed
    action: wait
    params:
      timeout: 120
      poll_interval: 10
      until:
        probe: cluster.health
        # The cluster must remain reachable with one node down; we are testing
        # rejoin, not survivability, which resilience/worker-node-failure covers.

  - id: start_target_node
    action: chaos.start_node
    params:
      node: node-5

  - id: wait_for_reregistration
    action: wait
    params:
      timeout: 300
      poll_interval: 10
      until:
        probe: node.etcd_registered
        params:
          node: node-5
        expect:
          registered: true

  - id: wait_for_convergence
    action: wait
    params:
      timeout: 300
      poll_interval: 15
      until:
        probe: cluster.reconcile_clean
        expect:
          clean: true

assertions:
  - type: probe
    id: node_registered_after
    probe: node.etcd_registered
    params:
      node: node-5
    expect:
      registered: true

  - type: probe
    id: etcd_membership_intact
    probe: cluster.etcd_members
    expect:
      count: 5

  - type: probe
    id: cluster_healthy_after
    probe: cluster.health
    expect:
      status: healthy

  # Convergence, not liveness. A node that is "up" but has not applied desired
  # state is the exact condition the 2026-08-14 join failure produced: the node
  # reported ready while its workload install had failed.
  - type: probe
    id: reconcile_clean_after
    probe: cluster.reconcile_clean
    expect:
      clean: true

  - type: probe
    id: packages_installed_after
    probe: node.installed_packages
    params:
      node: node-5

  # A converged cluster with ERROR findings is not converged in any useful
  # sense. This is the gate the quickstart harness already applies elsewhere.
  - type: probe
    id: no_error_findings
    probe: doctor.report_severity
    expect:
      error_count: 0

artifacts:
  collect:
    - type: logs
      node: node-5
      service: node-agent

cleanup:
  - type: probe
    id: final_cluster_health
    probe: cluster.health
    expect:
      status: healthy
